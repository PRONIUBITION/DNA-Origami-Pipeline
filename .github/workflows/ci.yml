name: CI

on:
  push:
  pull_request:

jobs:
  syntax-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight test dependencies
        run: python -m pip install pytest PyYAML ruff
      - name: Compile source
        run: python -m compileall -q dimer monomer multicodes
      - name: Run repository checks
        run: python -m pytest
      - name: Run critical lint checks
        run: ruff check .
